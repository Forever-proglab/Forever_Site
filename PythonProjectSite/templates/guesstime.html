<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра: замер времени</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Игра: замерь время между нажатиями</h1>
    <p>Нажми кнопку дважды: первый раз — старт, второй — стоп.</p>

    <button id="timer-btn">Нажми меня!</button>
    <div id="result"></div>
    <ul>
        <li><a href="/">main page</a> </li>
    </ul>

    <script>
        const btn = document.getElementById('timer-btn');
        const resultEl = document.getElementById('result');
        const tim = document.getElementById('time');

        let startTime = null;
        let isRunning = false;

        btn.addEventListener('click', () => {
            const now = performance.now(); // более точное время в миллисекундах

            if (!isRunning) {
                // Первое нажатие: старт
                startTime = now;
                isRunning = true;
                n = now - startTime
                tim.textContent = 'Секунды: ${n} ';
<!--                btn.textContent = 'Нажми, чтобы остановить';-->
            } else {
                // Второе нажатие: стоп
                const elapsedMs = now - startTime;
                const seconds = elapsedMs / 1000;
                resultEl.textContent = `Время между нажатиями: ${seconds.toFixed(4)} сек.`;

                // Сброс для следующей попытки (опционально)
                isRunning = false;
                startTime = null;
                btn.textContent = 'Нажми меня!';
            }
        });
    </script>
</body>
</html>
