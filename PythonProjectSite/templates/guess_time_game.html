<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Угадай время</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 60px;
    background: #f5f5f5;
  }
  h1 { margin-bottom: 10px; }
  #timer-display {
    font-size: 48px;
    font-weight: bold;
    color: #333;
    margin: 20px 0;
    min-height: 60px;
  }
  #game-btn {
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    transition: background 0.2s;
  }
  #game-btn:hover { background: #45a049; }
  #game-btn.running { background: #f44336; }
  #game-btn.running:hover { background: #d32f2f; }
  #guess-section {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #guess-input {
    padding: 10px;
    font-size: 18px;
    border: 2px solid #ccc;
    border-radius: 6px;
    width: 200px;
    text-align: center;
  }
  #submit-guess {
    padding: 10px 30px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #2196F3;
    color: white;
    cursor: pointer;
  }
  #submit-guess:hover { background: #1976D2; }
  #result {
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 30px;
  }
  .hint { color: #888; font-size: 14px; }
</style>
</head>
<body>
<ul>
        <li><a href="/choosegame">Choose game</a> </li>
    </ul>
<h1>Угадай время</h1>
<p class="hint">Нажмите кнопку, чтобы запустить таймер. Нажмите ещё раз — чтобы остановить.</p>


<button id="game-btn" type="button">Начать</button>

<div id="guess-section">
  <label for="guess-input">Сколько секунд прошло? Введите ваше время:</label>
  <input id="guess-input" type="number" step="0.01" min="0" placeholder="например, 3.50">
  <button id="submit-guess" type="button">Проверить</button>
</div>

<div id="result"></div>

<script>
  const btn = document.getElementById('game-btn');
  const guessSection = document.getElementById('guess-section');
  const guessInput = document.getElementById('guess-input');
  const submitGuess = document.getElementById('submit-guess');
  const result = document.getElementById('result');

  let startTime = 0;
  let endTime = 0;
  let elapsed = 0;
  let intervalId = null;
  let isRunning = false;

  // Допустимая погрешность — 0.5 секунды (точное совпадение нереально для человека)
  const TOLERANCE = 0.1;

  btn.addEventListener('click', () => {
    if (!isRunning) {
      // Первое нажатие — запускаем таймер
      startTime = Date.now();
      isRunning = true;
      btn.textContent = 'Стоп';
      btn.classList.add('running');
      result.textContent = '';
      guessSection.style.display = 'none';

    } else {
      // Второе нажатие — останавливаем
      endTime = Date.now();
      elapsed = (endTime - startTime) / 1000;
      clearInterval(intervalId);
      isRunning = false;
      btn.textContent = 'Начать заново';
      btn.classList.remove('running');

      // Показываем поле для ввода догадки
      guessSection.style.display = 'flex';
      guessInput.value = '';
      guessInput.focus();
    }
  });

  submitGuess.addEventListener('click', () => {
    const userGuess = parseFloat(guessInput.value);

    if (isNaN(userGuess) || userGuess < 0) {
      result.style.color = '#f44336';
      result.textContent = 'Введите корректное число секунд';
      return;
    }

    const diff = Math.abs(userGuess - elapsed);

    if (diff <= TOLERANCE) {
      result.style.color = '#4CAF50';
      result.textContent = `Вы угадали! Прошло ${elapsed.toFixed(2)} сек, отклонение ${diff.toFixed(2)} сек. не больше ${TOLERANCE} сек.`;
    } else {
      result.style.color = '#f44336';
      result.textContent = `Не угадали. Прошло ${elapsed.toFixed(2)} сек, отклонение ${diff.toFixed(2)} сек. больше ${TOLERANCE} сек.`;
    }
  });

  // Enter в поле ввода тоже отправляет
  guessInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitGuess.click();
  });
</script>

</body>
</html>
